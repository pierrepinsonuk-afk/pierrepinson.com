num: 2
title: Electricity spot markets (e.g., day-ahead)
intro: We start our description of electricity markets by concentrating on so-called *"spot" markets*, as for the example of the *day-ahead electricity markets* we have in Europe.
topics: [Bilateral contracts and electricity pools, Market clearing as an optimization problem, Prices and settlement, Zonal and network aspects, Impact of regulation and support schemes]
interviews:
  - [Klaus Skytte (Nordic Energy Research), Fg2ofpBnQR0, "Klaus Skytte was the head of the Energy Economics and Regulation group at DTU Management and is now the Director of Nordic Energy Research. We discuss the importance of electricity markets and regulation in the energy transition."]
