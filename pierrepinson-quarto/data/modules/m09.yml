num: 9
title: Renewable energy forecasting – First steps
intro: In this module we take a first go at *renewable energy forecasting*, looking at the numerous accessible ways to generate forecasts, often with already acceptable performance. Even if that performance is not seen as acceptable, these approaches comprise benchmarks to be outperformed when investing in more advanced forecasting approaches.
topics: [General aspects of renewable energy forecasting approaches, Benchmark approaches, "Using (linear) regression for forecasting", Exploring the data to pick input variables and use them cleverly]
