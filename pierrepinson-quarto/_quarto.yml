project:
  type: website
  pre-render: python scripts/build.py
  resources:
    - files/
    - CNAME

website:
  title: "Pierre Pinson"
  site-url: "https://pierrepinson.com"
  description: "Forecasting, analytics and decision sciences, with a focus on energy and electricity markets."
  favicon: images/favicon.svg
  open-graph: true
  search: true
  navbar:
    left:
      - href: about.qmd
        text: About
      - href: publications.qmd
        text: Publications
      - text: Teaching
        menu:
          - href: teaching/index.qmd
            text: Renewables in Electricity Markets
          - href: teaching/exercises.qmd
            text: Exercises
          - href: teaching/interviews.qmd
            text: Interviews
      - href: ijf.qmd
        text: IJF
      - href: news/index.qmd
        text: News
    right:
      - text: CV
        href: https://pierrepinson.com/wp-content/uploads/2023/03/ppinsoncv.pdf
      - icon: mortarboard
        href: https://scholar.google.com/citations?user=8Ai6cssAAAAJ
        aria-label: Google Scholar
      - icon: linkedin
        href: https://www.linkedin.com/in/pierrepinson
        aria-label: LinkedIn
      - icon: twitter-x
        href: https://x.com/pierrepinson
        aria-label: X (Twitter)
  page-footer:
    left: "© 2026 Pierre Pinson"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      dark: [cosmo, scss/common.scss, scss/dark.scss]
      light: [cosmo, scss/common.scss, scss/light.scss]
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    html-math-method: katex
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
