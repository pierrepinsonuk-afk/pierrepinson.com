num: 5
title: Impact of renewables on electricity markets
intro: As more and more *renewable energy generation* is present in *electricity markets*, one ought to understand the resulting *impact*. It is first necessary to get a few aspects right, for instance what the electricity cost is composed of, and what may impact electricity markets more generally. Indeed, electricity markets were affected by weather and climate before renewable energy was part of the picture anyway.
topics: [Electricity cost and the cost structure, "What impacts electricity markets generally (weather and climate)", How renewable generation affects market outcomes and dynamics, Simulating that impact and analysing it from real market data]
